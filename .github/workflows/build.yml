name: Build macOS Whisper CLI

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
    inputs:
      whisper_tag:
        description: Published stable upstream tag (empty selects the latest stable version)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: macos-whisper-cli
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      upstream_tag: ${{ steps.check.outputs.upstream_tag }}
      commit: ${{ steps.check.outputs.commit }}
      recipe: ${{ steps.check.outputs.recipe }}
      release_tag: ${{ steps.check.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check the latest stable source and published packages
        id: check
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WHISPER_TAG: ${{ inputs.whisper_tag }}
        run: node scripts/release.mjs check

  build:
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            cpu: arm64
            os: macos-26
            metal: 'ON'
          - arch: x64
            cpu: x86_64
            os: macos-15-intel
            metal: 'OFF'
    steps:
      - name: Check out the build scripts
        uses: actions/checkout@v7.0.1
        with:
          path: builder
          persist-credentials: false
      - name: Check out the exact upstream commit
        uses: actions/checkout@v7.0.1
        with:
          repository: ggml-org/whisper.cpp
          ref: ${{ needs.check.outputs.commit }}
          path: upstream
          persist-credentials: false
      - name: Build, test and package the CLI
        working-directory: upstream
        env:
          ARCH: ${{ matrix.arch }}
          CPU: ${{ matrix.cpu }}
          METAL: ${{ matrix.metal }}
        shell: bash
        run: bash "$GITHUB_WORKSPACE/builder/scripts/build.sh"
      - name: Upload the verified archive
        uses: actions/upload-artifact@v7.0.1
        with:
          name: whisper-bin-macos-${{ matrix.arch }}
          path: upstream/whisper-bin-macos-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    needs: [check, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: whisper-bin-macos-*
          path: release
          merge-multiple: true
      - name: Publish both architectures together
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WHISPER_TAG: ${{ needs.check.outputs.upstream_tag }}
          WHISPER_COMMIT: ${{ needs.check.outputs.commit }}
          BUILD_RECIPE: ${{ needs.check.outputs.recipe }}
          RELEASE_TAG: ${{ needs.check.outputs.release_tag }}
        run: node scripts/release.mjs publish

  keepalive:
    # Public repositories can lose scheduled runs after 60 days without activity.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Record repository activity at most once every 28 days
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/release.mjs keepalive